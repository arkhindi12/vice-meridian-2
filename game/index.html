<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Meridian II</title>
<meta name="description" content="Vice Meridian II — an open-world crime game in the browser: ten missions, a named cast, five stars, a police helicopter with a searchlight, three radio stations and a city you can spend a night in.">
<style>
  html, body { margin: 0; height: 100%; background: #07050d; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
  #stage { position: relative; box-shadow: 0 0 90px rgba(255,47,134,0.12); }
  #scene, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #scene { cursor: crosshair; touch-action: none; }
  #overlay { pointer-events: none; }
  #status {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; color: #fff;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene" aria-label="Vice Meridian II, an open-world crime game. WASD to walk and drive, shift to run, E to take or leave a car or to buy at a shop, the left mouse button to shoot, R to reload, TAB to change radio station."></canvas>
  <canvas id="overlay" aria-hidden="true"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
